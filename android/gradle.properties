# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Uncomment to run Gradle in incubating parallel mode for multi-module projects.
# org.gradle.parallel=true

# Kotlin code style for this project: "official" or "obsolete".
kotlin.code.style=official

# AndroidX is the modern support-library namespace — required for every modern Compose app.
android.useAndroidX=true

# AGP 9 auto-applies the Kotlin Android plugin when it detects com.android.application.
# Our build.gradle.kts still applies id("org.jetbrains.kotlin.android") explicitly, which
# collides with the auto-apply. This opt-out keeps the explicit plugin authoritative.
# AGP flags this flag itself as deprecated; the long-term migration is to drop the
# explicit plugin line, but we keep both here until we refactor the plugins DSL.
android.builtInKotlin=false

# Retain these three non-deprecated dependency-resolution flags for now.
# They control how Gradle handles transitive Android-library dependencies.
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
